name: Portside
options:
  bundleIdPrefix: com.sajid
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Portside:
    type: application
    platform: macOS
    sources:
      - path: Portside
    settings:
      base:
        PRODUCT_NAME: Portside
        PRODUCT_BUNDLE_IDENTIFIER: com.sajid.Portside
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        # Local dev: ad-hoc signing. For distribution switch to your Developer ID
        # identity and notarize. The app is intentionally NOT sandboxed: it needs
        # to inspect other processes (lsof) and talk to the Docker CLI.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
